name: 🚀 Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manueller Trigger über GitHub UI

jobs:
  deploy:
    name: Deploy → Pi 4B
    runs-on: self-hosted   # Läuft direkt auf dem Raspberry Pi
    timeout-minutes: 15

    steps:
      - name: 📥 Pull latest code
        run: |
          cd ~/Desk-Assistent
          git fetch origin main
          git reset --hard origin/main

      - name: 📦 Install dependencies
        run: |
          cd ~/Desk-Assistent
          npm ci --prefer-offline 2>/dev/null || npm install

      - name: 🔨 Build Next.js app
        run: |
          cd ~/Desk-Assistent
          npm run build

      - name: ♻️ Restart service
        run: |
          sudo systemctl restart desk-assistant.service
          sleep 3
          systemctl is-active --quiet desk-assistant.service && echo "✅ Service running" || echo "❌ Service failed"

      - name: 📋 Deployment info
        run: |
          echo "---"
          echo "Deployed commit: $(git -C ~/Desk-Assistent rev-parse --short HEAD)"
          echo "Time: $(date)"
          echo "---"
