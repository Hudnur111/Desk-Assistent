[project]
name = "jarvis-desk-assistant"
version = "0.1.0"
description = "Autonomer Desk-Assistant fuer Raspberry Pi 4 (Phase 1: Konsolen-MVP)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.3.0",
    "openwakeword>=0.6.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
